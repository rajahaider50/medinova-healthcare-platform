<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found — MediNova</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo/favicon.svg">
  <style>
    html,body{height:100%;margin:0;background:#070a14;color:#eef2ff;font-family:Inter,system-ui,sans-serif;display:flex;align-items:center;justify-content:center;text-align:center}
    .wrap{padding:24px;max-width:420px}
    img{width:72px;height:72px}
    h1{font-family:Sora,sans-serif;font-size:28px;margin:20px 0 8px}
    p{color:#94a3b8;line-height:1.6}
    a{display:inline-block;margin-top:18px;color:#8b5cf6;text-decoration:none;font-weight:600;border:1px solid rgba(139,92,246,.4);padding:10px 22px;border-radius:12px}
  </style>
  <script>
    if (!location.hash) { location.replace(location.pathname + '#/'); }
  </script>
</head>
<body>
  <div class="wrap">
    <img src="assets/logo/logo-mark.svg" alt="MediNova">
    <h1>404 — Page Not Found</h1>
    <p>The page you are looking for could not be found. Head back to the MediNova dashboard.</p>
    <a href="#/">Open MediNova</a>
  </div>
</body>
</html>
